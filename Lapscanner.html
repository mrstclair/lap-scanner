<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lap Scanner</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 12px; background: #0f172a; color: #e2e8f0; }
  h2 { margin: 4px 0 12px; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  select, input, button { font-size: 16px; padding: 8px; border-radius: 8px; border: 1px solid #334155;
    background: #1e293b; color: #e2e8f0; }
  button { background: #2563eb; border-color: #2563eb; font-weight: 600; cursor: pointer; }
  button.secondary { background: #334155; border-color: #334155; }
  #reader { width: 100%; max-width: 420px; margin: 0 auto; border-radius: 12px; overflow: hidden; }
  #manual { display: flex; gap: 8px; margin: 10px 0; }
  #manual input { flex: 1; }
  #feedback { min-height: 92px; margin-top: 12px; padding: 16px; border-radius: 12px;
    text-align: center; font-size: 22px; font-weight: 700; transition: background .2s; }
  .ok { background: #16a34a; color: #fff; }
  .err { background: #dc2626; color: #fff; }
  .warn { background: #d97706; color: #fff; }
  .sub { font-size: 15px; font-weight: 500; opacity: .95; margin-top: 4px; }
  #log { margin-top: 12px; font-size: 12px; font-family: monospace; color: #94a3b8;
    background: #1e293b; border-radius: 8px; padding: 8px; max-height: 160px; overflow-y: auto; white-space: pre-wrap; }
</style>
</head>
<body>
<h2>🏃 Lap Scanner</h2>

<div class="controls">
  <select id="location"></select>
  <input id="lapLen" type="number" style="width:110px" title="Lap length (m)">
  <input id="device" placeholder="Station label" style="width:120px">
  <button class="secondary" id="camBtn" onclick="toggleCam()">📷 Start camera</button>
</div>

<div id="reader"></div>

<div id="manual">
  <input id="manualId" placeholder="Scan badge here (or type ID) and it logs" autocomplete="off" autofocus>
  <button onclick="submitManual()">Log</button>
</div>

<div id="feedback">Loading…</div>
<div id="log"></div>

<script src="https://unpkg.com/html5-qrcode"></script>
<script>
// ====== YOUR SETTINGS (already filled in) ======
const EXEC_URL = 'https://script.google.com/macros/s/AKfycbyjMF7jZ7tc8d77Q7_SsP7clwpZXJ6t41Qw6UIDE5RU_5OJFStP82tj-Ydzxpb_8f0xeA/exec';
const TOKEN    = 'f362693a';
// ===============================================

let scanner = null, camOn = false;

function logLine(msg) {
  const el = document.getElementById('log');
  const t = new Date().toLocaleTimeString();
  el.textContent = '[' + t + '] ' + msg + '\n' + el.textContent;
}

fetch(EXEC_URL + '?bootstrap=1')
  .then(r => r.json())
  .then(cfg => {
    const loc = document.getElementById('location');
    (cfg.locations || ['Track']).forEach(l => { const o = document.createElement('option'); o.value = o.text = l; loc.add(o); });
    document.getElementById('lapLen').value = cfg.defaultLapLengthM || 400;
    setFeedback('', 'Ready to scan');
    logLine('Bootstrap OK.');
    if (cfg.token && cfg.token !== TOKEN) logLine('⚠ TOKEN MISMATCH — server token differs from this file.');
  })
  .catch(e => {
    const loc = document.getElementById('location');
    ['Track','Gym','Hall','Playground'].forEach(l => { const o = document.createElement('option'); o.value = o.text = l; loc.add(o); });
    document.getElementById('lapLen').value = 400;
    setFeedback('', 'Ready to scan');
    logLine('Bootstrap fetch failed: ' + e);
  });

const mi = document.getElementById('manualId');
mi.addEventListener('keydown', e => { if (e.key === 'Enter') submitManual(); });
function submitManual() { const v = mi.value.trim(); if (!v) return; mi.value = ''; send(v); }

let lastCode = '', lastTime = 0;
function onScan(txt) {
  const now = Date.now();
  if (txt === lastCode && now - lastTime < 2500) return;
  lastCode = txt; lastTime = now;
  logLine('Decoded QR → ' + txt);
  send(txt.trim());
}
function onScanError() { /* per-frame decode misses are normal; ignore */ }

function send(id) {
  const payload = {
    token: TOKEN, studentId: id,
    location: document.getElementById('location').value,
    lapLengthM: Number(document.getElementById('lapLen').value),
    deviceLabel: document.getElementById('device').value
  };
  logLine('POST → ' + id);
  fetch(EXEC_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  })
  .then(r => r.text())
  .then(text => {
    let r;
    try { r = JSON.parse(text); }
    catch (e) { logLine('Server returned non-JSON: ' + text.slice(0,120)); setFeedback('err', 'Server error', 'See log below'); return; }
    logLine('Response: ' + JSON.stringify(r));
    showResult(r);
  })
  .catch(e => { logLine('Network error: ' + e); setFeedback('err', 'Network error', String(e)); });
}

function showResult(r) {
  if (r.ok) setFeedback('ok', '✔ ' + r.name, 'Gr ' + r.grade + ' · ' + r.todayLaps + ' laps today');
  else if (r.cooldown) setFeedback('warn', r.name || 'Wait', r.msg);
  else setFeedback('err', '✖ ' + r.msg);
}

function setFeedback(cls, main, sub) {
  const f = document.getElementById('feedback');
  f.className = cls;
  f.innerHTML = main + (sub ? '<div class="sub">' + sub + '</div>' : '');
  if (cls && navigator.vibrate) navigator.vibrate(cls === 'ok' ? 60 : 150);
  if (cls) setTimeout(() => { f.className = ''; f.textContent = 'Ready to scan'; }, 2600);
  mi.focus();
}

async function toggleCam() {
  const btn = document.getElementById('camBtn');
  if (camOn) { scanner.stop().then(() => { camOn = false; btn.textContent = '📷 Start camera'; }); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setFeedback('err', 'Camera unsupported', 'Use a USB/Bluetooth scanner or manual entry.');
    return;
  }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
  } catch (err) {
    setFeedback('err', 'Camera: ' + err.name, err.message);
    logLine('Camera error: ' + err.name);
    return;
  }
  stream.getTracks().forEach(t => t.stop());
  scanner = scanner || new Html5Qrcode('reader');
  scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: 250 }, onScan, onScanError)
    .then(() => { camOn = true; btn.textContent = '⏹ Stop camera'; logLine('Camera started.'); })
    .catch(e => { setFeedback('err', 'Camera start failed', String(e)); logLine('Start failed: ' + e); });
}
</script>
</body>
</html>
