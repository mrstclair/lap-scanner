<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lap Scanner</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 12px; background: #0f172a; color: #e2e8f0; }
  h2 { margin: 4px 0 12px; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  select, input, button { font-size: 16px; padding: 8px; border-radius: 8px; border: 1px solid #334155;
    background: #1e293b; color: #e2e8f0; }
  button { background: #2563eb; border-color: #2563eb; font-weight: 600; cursor: pointer; }
  button.secondary { background: #334155; border-color: #334155; }
  label.dist { display: flex; align-items: center; gap: 4px; font-size: 13px; color: #94a3b8; }
  #reader { width: 100%; max-width: 420px; margin: 0 auto; border-radius: 12px; overflow: hidden; }
  #manual { display: flex; gap: 8px; margin: 10px 0; }
  #manual input { flex: 1; }
  #feedback { min-height: 92px; margin-top: 12px; padding: 16px; border-radius: 12px;
    text-align: center; font-size: 22px; font-weight: 700; transition: background .2s; }
  .ok { background: #16a34a; color: #fff; }
  .err { background: #dc2626; color: #fff; }
  .warn { background: #d97706; color: #fff; }
  .sub { font-size: 15px; font-weight: 500; opacity: .95; margin-top: 4px; }
  #savedNote { font-size: 12px; color: #16a34a; min-height: 16px; margin-bottom: 6px; }
  #log { margin-top: 12px; font-size: 12px; font-family: monospace; color: #94a3b8;
    background: #1e293b; border-radius: 8px; padding: 8px; max-height: 160px; overflow-y: auto; white-space: pre-wrap; }
</style>
</head>
<body>
<h2>🏃 Lap Scanner</h2>

<div class="controls">
  <select id="location" onchange="locationChanged()"></select>
  <label class="dist">Distance/lap:
    <input id="lapVal" type="number" step="any" style="width:90px" onchange="saveDistance()">
    <select id="unit" style="width:80px" onchange="unitChanged()">
      <option value="m">meters</option>
      <option value="mi">miles</option>
    </select>
  </label>
  <input id="device" placeholder="Station label" style="width:120px">
  <button class="secondary" id="camBtn" onclick="toggleCam()">📷 Start camera</button>
  <label class="dist"><input type="checkbox" id="soundOn" checked> 🔊 Sound</label>
</div>
<div id="savedNote"></div>

<div id="reader"></div>

<div id="manual">
  <input id="manualId" placeholder="Scan badge here (or type ID) and it logs" autocomplete="off" autofocus>
  <button onclick="submitManual()">Log</button>
</div>

<div id="feedback">Loading…</div>
<div id="log"></div>

<script src="https://unpkg.com/html5-qrcode"></script>
<script>
// ====== YOUR SETTINGS ======
const EXEC_URL = 'https://script.google.com/macros/s/AKfycbyjMF7jZ7tc8d77Q7_SsP7clwpZXJ6t41Qw6UIDE5RU_5OJFStP82tj-Ydzxpb_8f0xeA/exec';
const TOKEN    = 'f362693a';
// ===========================

const M_PER_MILE = 1609.344;
let scanner = null, camOn = false;
let LOC_LAPS = {}, DEFAULT_M = 400;

// ---- Sound (Web Audio, no files needed) ----
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(kind) {
  if (!document.getElementById('soundOn').checked || !audioCtx) return;
  const now = audioCtx.currentTime;
  function tone(freq, start, dur, vol) {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0, now + start);
    g.gain.linearRampToValueAtTime(vol, now + start + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, now + start + dur);
    o.start(now + start); o.stop(now + start + dur);
  }
  if (kind === 'ok') { tone(880, 0, 0.12, 0.3); tone(1320, 0.10, 0.15, 0.3); }      // rising ding
  else if (kind === 'warn') { tone(300, 0, 0.25, 0.25); }                            // low buzz (cooldown)
  else { tone(200, 0, 0.18, 0.3); tone(160, 0.16, 0.22, 0.3); }                     // error (unknown)
}

function logLine(msg) {
  const el = document.getElementById('log');
  const t = new Date().toLocaleTimeString();
  el.textContent = '[' + t + '] ' + msg + '\n' + el.textContent;
}

fetch(EXEC_URL + '?bootstrap=1')
  .then(r => r.json())
  .then(cfg => {
    LOC_LAPS = cfg.locationLaps || {};
    DEFAULT_M = cfg.defaultLapLengthM || 400;
    const loc = document.getElementById('location');
    (cfg.locations || ['Track']).forEach(l => { const o = document.createElement('option'); o.value = o.text = l; loc.add(o); });
    locationChanged();
    setFeedback('', 'Ready to scan');
    logLine('Bootstrap OK.');
    if (cfg.token && cfg.token !== TOKEN) logLine('⚠ TOKEN MISMATCH.');
  })
  .catch(e => {
    const loc = document.getElementById('location');
    ['Track','Gym','Hall','Playground'].forEach(l => { const o = document.createElement('option'); o.value = o.text = l; loc.add(o); });
    locationChanged();
    setFeedback('', 'Ready to scan');
    logLine('Bootstrap fetch failed: ' + e);
  });

function currentMeters() {
  const loc = document.getElementById('location').value;
  return LOC_LAPS[loc] != null ? LOC_LAPS[loc] : DEFAULT_M;
}
function refreshDisplay() {
  const unit = document.getElementById('unit').value;
  const m = currentMeters();
  document.getElementById('lapVal').value = unit === 'mi' ? +(m / M_PER_MILE).toFixed(4) : Math.round(m);
}
function locationChanged() { refreshDisplay(); document.getElementById('savedNote').textContent = ''; }
function unitChanged() { refreshDisplay(); }

function saveDistance() {
  const unit = document.getElementById('unit').value;
  const val = Number(document.getElementById('lapVal').value);
  if (!val || val <= 0) return;
  const meters = unit === 'mi' ? val * M_PER_MILE : val;
  const loc = document.getElementById('location').value;
  LOC_LAPS[loc] = meters;
  fetch(EXEC_URL, {
    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: 'setLocationLaps', token: TOKEN, location: loc, meters: meters })
  })
  .then(r => r.text()).then(t => {
    try { const r = JSON.parse(t); if (r.ok) { LOC_LAPS = r.locationLaps; document.getElementById('savedNote').textContent = '✓ Saved ' + loc + ' distance'; } }
    catch (e) { logLine('Save error: ' + t.slice(0,80)); }
  })
  .catch(e => logLine('Save network error: ' + e));
}

const mi = document.getElementById('manualId');
mi.addEventListener('keydown', e => { if (e.key === 'Enter') submitManual(); });
function submitManual() { ensureAudio(); const v = mi.value.trim(); if (!v) return; mi.value = ''; send(v); }

let lastCode = '', lastTime = 0;
function onScan(txt) {
  const now = Date.now();
  if (txt === lastCode && now - lastTime < 2500) return;
  lastCode = txt; lastTime = now;
  logLine('Decoded QR → ' + txt);
  send(txt.trim());
}
function onScanError() {}

function send(id) {
  const payload = {
    token: TOKEN, studentId: id,
    location: document.getElementById('location').value,
    lapLengthM: currentMeters(),
    deviceLabel: document.getElementById('device').value
  };
  logLine('POST → ' + id);
  fetch(EXEC_URL, {
    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  })
  .then(r => r.text())
  .then(text => {
    let r;
    try { r = JSON.parse(text); }
    catch (e) { logLine('Server returned non-JSON: ' + text.slice(0,120)); setFeedback('err', 'Server error', 'See log'); beep('err'); return; }
    logLine('Response: ' + JSON.stringify(r));
    showResult(r);
  })
  .catch(e => { logLine('Network error: ' + e); setFeedback('err', 'Network error', String(e)); beep('err'); });
}

function showResult(r) {
  if (r.ok) { setFeedback('ok', '✔ ' + r.name, 'Gr ' + r.grade + ' · ' + r.todayLaps + ' laps today'); beep('ok'); }
  else if (r.cooldown) { setFeedback('warn', r.name || 'Wait', r.msg); beep('warn'); }
  else { setFeedback('err', '✖ ' + r.msg); beep('err'); }
}

function setFeedback(cls, main, sub) {
  const f = document.getElementById('feedback');
  f.className = cls;
  f.innerHTML = main + (sub ? '<div class="sub">' + sub + '</div>' : '');
  if (cls && navigator.vibrate) navigator.vibrate(cls === 'ok' ? 60 : 150);
  if (cls) setTimeout(() => { f.className = ''; f.textContent = 'Ready to scan'; }, 2600);
  mi.focus();
}

async function toggleCam() {
  ensureAudio();
  const btn = document.getElementById('camBtn');
  if (camOn) { scanner.stop().then(() => { camOn = false; btn.textContent = '📷 Start camera'; }); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setFeedback('err', 'Camera unsupported', 'Use a USB/Bluetooth scanner or manual entry.'); return;
  }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }); }
  catch (err) { setFeedback('err', 'Camera: ' + err.name, err.message); logLine('Camera error: ' + err.name); return; }
  stream.getTracks().forEach(t => t.stop());
  scanner = scanner || new Html5Qrcode('reader');
  scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: 250 }, onScan, onScanError)
    .then(() => { camOn = true; btn.textContent = '⏹ Stop camera'; logLine('Camera started.'); })
    .catch(e => { setFeedback('err', 'Camera start failed', String(e)); logLine('Start failed: ' + e); });
}
</script>
</body>
</html>
